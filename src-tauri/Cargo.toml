[package]
name = "z-biz-tool-note"
version = "1.2.0"
description = "美观的Markdown笔记应用"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_note_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", features = ["tauri"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# reqwest / futures 已随 AI 接入层迁入 cap-llm（本仓 src/ 不再直接发 HTTP）
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
# 能力层：data URI 拆分与 base64 编解码（mime→ext 映射仍在本仓）
#
# 2026-10-21 由 0.2.0 升到 0.3.0：cap-img 0.3.0 已发到 crates.io，
# 而 caret `^0.2.0` **永远不会**解析到 0.3.0（0.x 语义下 minor 即 breaking）。
#
# 依据（源码级核对）：把 crates.io 上的 0.2.0 与 0.3.0 逐函数比对、去空白
# 归一化后，本仓用到的 encode_data_url / decode_data_url **0 字符差异**
# ⇒ 本次升级零行为变化。0.3.0 的三处修复（crop 坐标溢出 / EXIF 越界切片 /
# 名字说谎）在本仓**不可达**。
#
# 升级的收益：家族四个消费方停在同一个能力层版本上。
cap-img = "0.3.0"
# 能力层：统一 AI 接入（协议/鉴权/SSE 解码/脱敏都在 cap-llm，本仓只留提示词）。
# cap-llm 尚未发 crates.io，与 file 仓一致走 path 依赖。
cap-llm = { path = "../../z-biz-tool-capability/crates/cap-llm" }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
parking_lot = "0.12"
keyring = "4.2.0"
