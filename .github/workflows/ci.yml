name: CI

# build-release.yml 只在 `push: tags: v*` 上跑，也就是说往 main 推任何东西都不会有门禁；
# 想验一次就得打 tag，而 tag 触发的是四平台打包 —— 为了拿一个"typecheck 过不过"的答案
# 付四份 bundle 的开销。这里把廉价门禁拆出来，每次 push / PR 跑，出包仍旧只认 tag。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支上后一次推送直接取消前一次：本仓有多会话并行直推 main 的习惯，
# 不取消的话每次 WIP 都会把三平台 runner 占满。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: 前端 typecheck + 构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 本仓的 tests/*.test.ts 此前从来没进过 CI：仓库里有测试、package.json 里有
      # test 脚本，但这条流水线只跑 typecheck + build（Rust 那边有 cargo test，
      # 前端这边一个断言都没跑）。改了逻辑红了，CI 不会知道。
      # 放在 Build 之前：断言是秒级的，挂在构建后面等于白挂。
      - name: Unit tests
        run: npm test

      # dist 在 .gitignore 里，而 tauri::generate_context! 要读 frontendDist，
      # 所以后端腿之前必须先出一次前端。
      - name: Build frontend
        run: npm run build

  backend:
    name: Rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 不排 macos：日常开发就在 macOS 上，那条腿本地已经证过；
        # 排 windows 是因为 src-tauri 里有 cfg(windows) 分支（atomic_write），
        # 那段代码只有 Windows runner 真编得到 —— 历史上正是在这里红过（E0425）。
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # cap-llm / cap-doc 走 ../../z-biz-tool-capability path 依赖；runner 上只有本仓，
      # 把公共能力仓取到 workspace 内，再链接到 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # runner 上新版 token 会写坏 rust-toolchain 生成的 cargo config（与 build-release.yml 同一条 workaround）
      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml" "${USERPROFILE:-$HOME}/.cargo/config.toml"

      - name: Build frontend (for Tauri context)
        run: |
          npm ci
          npm run build

      - name: Tests
        working-directory: src-tauri
        # `-- --nocapture`：Rust 测试框架默认**吞掉通过用例的 stdout/stderr**
        # （libtest 的输出捕获只放行失败用例的输出）⇒ 本仓
        # 「[LIVE] 跳过 minimax 真实 API 实测…」与「[bench] CI 环境：跳过 5000ms
        # 性能阈值判定…实测 NNNms」这类**跳过标记在 CI 日志里一个字都看不到**
        # ⇒ 「没跑」和「跑过了」在日志里长得一模一样。
        # 打开捕获后，跳过原因与实测值都进日志，可核对。
        run: cargo test -- --nocapture

      - name: Clippy
        # 2026-10-21 收严：原来这一步是「advisory」（不带 -D warnings），理由是
        # 「平台特有的告警本地量不到，升级成失败等于交一条永远红的 CI」。
        # 但本地实测 `cargo clippy --all-targets -- -D warnings` 已经是干净的（rc=0），
        # 而且**平台差异本来就只能靠 CI 量**（本仓 CI 跑 ubuntu）——
        # 让 CI 量一次，比永久挂着 advisory 门禁强：
        # 真出现平台特有告警，那是一条真 lint，该修而不是该藏。
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        # 新增门禁：rustfmt 差异之前只在本机量得到（2026-10-21 实测本仓有 74 处差异），
        # CI 完全不跑 ⇒ 谁改乱了格式没人知道。
        # 格式债已在同一次提交里整仓清零（纯排版，Rust 72 条 + 前端 212 条断言全过）。
        working-directory: src-tauri
        run: cargo fmt --all --check
